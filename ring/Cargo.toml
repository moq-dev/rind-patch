[package]
name = "ring"
# Above every ring 0.17 release, so every `^0.17.x` requirement takes this
# patch and none falls back to crates.io's ring.
version = "0.17.999"
edition.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
description = "rind-ring under ring's name, for a binary's [patch.crates-io]"

# Each of ring 0.17's features, so any feature a dependency requests resolves.
# Cargo resolves features for every target, so even quinn-proto's wasm-only
# `wasm32_unknown_unknown_js` must exist. `alloc` and `std` reach rind-ring,
# which gates RSA and the errors' `std::error::Error` impls on them as ring
# does; the rest change nothing.
[features]
default = ["alloc", "dev_urandom_fallback"]
alloc = ["rind-ring/alloc"]
dev_urandom_fallback = []
less-safe-getrandom-custom-or-rdrand = []
less-safe-getrandom-espidf = []
slow_tests = []
std = ["alloc", "rind-ring/std"]
test_logging = []
unstable-testing-arm-no-hw = []
unstable-testing-arm-no-neon = []
wasm32_unknown_unknown_js = []

[dependencies]
# The version fails to resolve once rind-ring moves past ring 0.17, so this
# shim follows it.
rind-ring = { version = "0.17", default-features = false }
